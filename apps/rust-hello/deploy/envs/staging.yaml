# Staging, namespace rust-hello-staging: the same chart and image digest prod will get.
# Argo CD deploys whatever is here on main, so changing the digest in a merged PR IS the
# deploy. The digest is in the release's notes.
environment: staging
image:
  digest: sha256:5e0e3d4ecc8f11ca835f22bf932d13dc025187c8fea0c3beb077ff8874e8e526 # rust-hello/v0.1.0
gateway:
  hostnames: ["staging.rust-hello.localhost"]
