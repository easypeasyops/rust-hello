# The app's port, which the chart's probes and Service use.
server.port=8000
# Kubernetes sends SIGTERM, then waits 30 s: finish the requests in hand, then exit.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.main.banner-mode=off

# /metrics on its own port: the chart's Service exposes it to Prometheus only.
management.server.port=${METRICS_PORT:9100}
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics

# No static files: an unknown path is a 404 counted as `unmatched`, not a match for /**.
spring.web.resources.add-mappings=false
