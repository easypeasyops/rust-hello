# Pinned versions only stay safe if something bumps them. Dependabot opens PRs; CI
# (including the image scan and smoke test) decides whether they're safe to merge.
version: 2
updates:
  - package-ecosystem: cargo
    directories: [/apps/rust-hello]
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions # bumps the pinned SHAs (and their # vX comments)
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates together, one PR a week; a major update arrives in a PR of
      # its own, because its inputs or behaviour can change.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The platform's reusable workflows move with platform.lock: Renovate's job
      # (renovate.json5). Dependabot names each by its path, hence both patterns.
      - dependency-name: easypeasyops/platform
      - dependency-name: easypeasyops/platform/*

  - package-ecosystem: docker # bumps the base image digests in the Dockerfiles
    directories: [/apps/*]
    schedule:
      interval: weekly
